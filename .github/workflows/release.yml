name: Release GardenUpdater

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B clean package

      - name: Prepare release asset
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "target/GardenUpdater-${VERSION}.jar" GardenUpdater.jar

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" GardenUpdater.jar --generate-notes --title "GardenUpdater ${GITHUB_REF_NAME}"
