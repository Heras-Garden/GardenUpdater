name: GardenUpdater
version: '${project.version}'
main: com.herasgarden.gardenupdater.GardenUpdater
api-version: '26.2'
author: Hera's Garden
website: https://herasgarden.net
description: Safely stages Hera's Garden plugin updates from GitHub Releases.

commands:
  gardenupdate:
    description: Check and stage Hera's Garden plugin updates.
    usage: /gardenupdate <status|check|stage|clear>
    aliases: [gupdate]

permissions:
  gardenupdater.admin:
    description: Manage GardenUpdater.
    default: op
